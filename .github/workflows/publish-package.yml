name: Publish Package to NuGet

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x
            9.x
            8.x

      - name: Restore dependencies
        run: dotnet restore src/TrophyApi/TrophyApi.csproj

      - name: Build Release
        run: dotnet build src/TrophyApi/TrophyApi.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/TrophyApi.Test/TrophyApi.Test.csproj --configuration Release

      - name: Publish
        run: |
          dotnet pack src/TrophyApi/TrophyApi.csproj -c Release -o out
          dotnet nuget push out/*.nupkg -s 'https://api.nuget.org/v3/index.json' -k ${{secrets.NUGET_API_KEY}} --skip-duplicate
